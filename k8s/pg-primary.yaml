apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-config
data:
  patroni.yml: |
    scope: hydra_cluster
    namespace: /service
    
    etcd3:
      hosts:
        - etcd-client:2379
    
    restapi:
      listen: 0.0.0.0:8008
      connect_address: localhost:8008
    
    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            max_connections: 100
            wal_level: replica
            max_wal_senders: 10
            max_replication_slots: 10
            hot_standby: "on"
            hot_standby_feedback: "on"
          pg_hba:
            - host replication replica_user 0.0.0.0/0 md5
            - host all all 0.0.0.0/0 md5
            - local all all trust
      init:
        post_bootstrap: /usr/local/bin/post_bootstrap.sh
    
    postgresql:
      listen: 0.0.0.0:5432
      connect_address: localhost:5432
      data_dir: /var/lib/postgresql/data
      bin_dir: /usr/local/bin
      pgpass: /var/lib/postgresql/.pgpass
      authentication:
        replication:
          username: replica_user
          password: replica_pwd
        superuser:
          username: postgres
          password: postgres_admin_pwd
      pg_hba:
        - host replication replica_user 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5
        - local all all trust
---
apiVersion: v1
kind: Service
metadata:
  name: pg-primary
  labels:
    app: pg-primary
spec:
  ports:
  - port: 5432
    name: postgres
  - port: 8008
    name: restapi
  selector:
    app: pg-primary
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-primary
spec:
  serviceName: pg-primary
  replicas: 1
  selector:
    matchLabels:
      app: pg-primary
  template:
    metadata:
      labels:
        app: pg-primary
    spec:
      containers:
      - name: postgres
        image: hydradb-postgres:latest # To be built locally
        imagePullPolicy: Never
        env:
        - name: PATRONI_NAME
          valueFrom:
            configMapKeyRef:
              name: hydra-config
              key: PATRONI_NAME_PRIMARY
        - name: PATRONI_RESTAPI_CONNECT_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: hydra-config
              key: PATRONI_RESTAPI_CONNECT_ADDRESS_PRIMARY
        - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: hydra-config
              key: PATRONI_POSTGRESQL_CONNECT_ADDRESS_PRIMARY
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: hydra-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hydra-secrets
              key: DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: hydra-config
              key: POSTGRES_DB
        ports:
        - containerPort: 5432
        - containerPort: 8008
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: config
          mountPath: /etc/patroni/patroni.yml
          subPath: patroni.yml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: patroni-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
