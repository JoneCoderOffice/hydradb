services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: etcd
    command:
      - etcd
      - --name=etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hydra_net

  pg_primary:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile.patroni
    container_name: pg_primary
    env_file:
      - ./nestapp/.env
    environment:
      PATRONI_NAME: pg_primary
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg_primary:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg_primary:5432
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./docker/postgres/patroni.yml:/etc/patroni/patroni.yml:ro
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - hydra_net

  pg_replica:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile.patroni
    env_file:
      - ./nestapp/.env
    volumes:
      - /var/lib/postgresql/data
      - ./docker/postgres/patroni.yml:/etc/patroni/patroni.yml:ro
    depends_on:
      etcd:
        condition: service_healthy
      pg_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - hydra_net

  pgbouncer_primary:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_primary
    volumes:
      - ./docker/pgbouncer/pgbouncer-primary.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      pg_primary:
        condition: service_healthy
    networks:
      - hydra_net

  pgbouncer_replica:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_replica
    volumes:
      - ./docker/pgbouncer/pgbouncer-replica.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      pg_replica:
        condition: service_healthy
    networks:
      - hydra_net

  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"
      - "5433:5433"
      - "3000:3000"
      - "8080:8080"
    depends_on:
      - pgbouncer_primary
      - pgbouncer_replica
    networks:
      - hydra_net

  app:
    build:
      context: ./nestapp
      dockerfile: Dockerfile
    env_file:
      - ./nestapp/.env
    depends_on:
      - haproxy
    networks:
      - hydra_net

  go_app:
    build:
      context: ./goapp
      dockerfile: Dockerfile
    env_file:
      - ./goapp/.env
    depends_on:
      - haproxy
    networks:
      - hydra_net


volumes:
  pg_primary_data:
  pg_replica_data:

networks:
  hydra_net:
    driver: bridge
